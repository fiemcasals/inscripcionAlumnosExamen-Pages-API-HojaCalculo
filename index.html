<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a Exámenes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }

        h2 {
            text-align: center;
            color: #166534;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }

        button {
            width: 100%;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #15803d;
        }

        button:active {
            transform: scale(0.98);
        }

        #mensaje {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            min-height: 24px;
            color: #166534;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Inscripción a Finales 📝</h2>
        <form id="formularioInscripcion">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label for="dni">DNI</label>
                <input type="number" id="dni" name="dni" required placeholder="Sin puntos ni espacios">
            </div>

            <div class="form-group">
                <label for="materia">Materia a rendir</label>
                <select id="materia" name="materia" required>
                    <option value="" disabled selected>Seleccioná una materia...</option>
                    <option value="Desarrollo Web">Desarrollo Web</option>
                    <option value="Bases de Datos">Bases de Datos</option>
                    <option value="Ingeniería de Software">Ingeniería de Software</option>
                </select>
            </div>

            <button type="submit" id="btnSubmit">Enviar Inscripción</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <script>
        // ¡Atención! Acá tenés que pegar la URL que te da Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiomI4nKIwWp1O0mKVroyFQWmxVWuYbdIl5peoX2vzxCO85UZVe_h2unxG4rptbgoN/exec';

        const form = document.getElementById('formularioInscripcion');
        const mensaje = document.getElementById('mensaje');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', function (e) {
            e.preventDefault(); // Evitamos que la página se recargue

            // Si no pusiste la URL, avisamos
            if (SCRIPT_URL === 'ACA_VA_TU_URL_DE_GOOGLE') {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Falta configurar la URL de Google Apps Script en el código JS.';
                return;
            }

            // Cambiamos el texto del botón mientras carga
            btnSubmit.textContent = 'Enviando...';
            btnSubmit.disabled = true;

            // Recolectamos los datos del formulario
            const data = new FormData(form);

            // Enviamos los datos a Google Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: data,
                mode: 'no-cors' // Evita errores de seguridad en navegadores
            })
                .then(() => {
                    mensaje.style.color = '#166534';
                    mensaje.textContent = '¡Inscripción registrada con éxito!';
                    form.reset(); // Vaciamos el formulario
                    btnSubmit.textContent = 'Enviar Inscripción';
                    btnSubmit.disabled = false;
                })
                .catch(error => {
                    mensaje.style.color = 'red';
                    mensaje.textContent = 'Hubo un error al enviar los datos.';
                    btnSubmit.textContent = 'Enviar Inscripción';
                    btnSubmit.disabled = false;
                });
        });
    </script>
</body>

</html>
